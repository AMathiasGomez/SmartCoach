<div class="app-container">
  <app-directivo-sidebar
    [open]="sidebarOpen"
    [activeSection]="activeSection"
    (close)="closeSidebar()"
    (logout)="logout()"
    (sectionChange)="showSection($event)"
  ></app-directivo-sidebar>

  <main class="main-content">
    <button class="hamburger" (click)="toggleSidebar()" aria-label="Abrir menu">
      <span class="material-symbols-outlined">menu</span>
    </button>

    <app-directivo-hero
      [activeSection]="activeSection"
      [saludInstitucional]="saludInstitucional"
      [totalEquipos]="totalEquipos"
      [totalJugadores]="totalJugadores"
      [totalPartidos]="totalPartidos"
      [totalEntrenamientos]="totalEntrenamientos"
      [totalReportes]="reportes.length"
      [actividadesPendientes]="proximasActividades.length"
      [alertasAbiertas]="alertas.length"
      (download)="downloadReport()"
    ></app-directivo-hero>

    <div class="state-card" *ngIf="loading">Cargando informacion directiva...</div>
    <div class="state-card error" *ngIf="!loading && error">{{ error }}</div>

    <ng-container *ngIf="!loading && !error">
      <app-directivo-kpis
        *ngIf="activeSection === 'resumen'"
        [totalJugadores]="totalJugadores"
        [totalEquipos]="totalEquipos"
        [totalPartidos]="totalPartidos"
        [partidosFinalizados]="partidosFinalizados"
        [totalEntrenamientos]="totalEntrenamientos"
        [winRate]="winRate"
        [promedioJugadoresPorEquipo]="promedioJugadoresPorEquipo"
        [coberturaEntrenamiento]="coberturaEntrenamiento"
      ></app-directivo-kpis>

      <app-directivo-overview
        *ngIf="activeSection === 'resumen'"
        [saludInstitucional]="saludInstitucional"
        [tendenciaClub]="tendenciaClub"
        [alertas]="alertas"
        [insights]="insights"
        [mejorEquipo]="mejorEquipo"
      ></app-directivo-overview>

      <app-directivo-reports
        *ngIf="activeSection === 'reportes'"
        [reportes]="reportes"
        (download)="downloadReport($event)"
      ></app-directivo-reports>

      <app-directivo-teams
        *ngIf="activeSection === 'equipos'"
        [equiposResumen]="equiposResumen"
        [distribucionCategorias]="distribucionCategorias"
      ></app-directivo-teams>

      <app-directivo-agenda
        *ngIf="activeSection === 'agenda'"
        [proximasActividades]="proximasActividades"
        [actualizaciones]="actualizaciones"
      ></app-directivo-agenda>
    </ng-container>
  </main>
</div>
